<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radinsdg ai</title>
    <link rel="stylesheet" href="ai.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="radinsdg.png" type="image/png">
    <link rel="apple-touch-icon" href="radinsdg.png">
</head>
<body>

    <div class="background-animation"></div>

    <div class="container">
        <header>
            <h1>Radinsdg<i class="fa-solid fa-robot"></i></h1>
            <p>دستیار هوش مصنوعی رادین اس دی جی</p>
        </header>

        <div class="chat-box" id="chatBox">
            <!-- پیام خوش‌آمدگویی اولیه -->
            <div class="message ai-message">
                <span>سلام، من دستیار هوشمند هستم هر سوالی که داری در خدمتم</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off">
            <button id="sendBtn"><i class="fa-solid fa-paper-plane">S</i></button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatBox = document.getElementById('chatBox');

            // بانک اطلاعاتی کلیدواژه‌ها و پاسخ‌های استاندارد
            const standardResponses = [
                { keywords: ['سلام', 'هی', 'درود', 'علیک'], response: "سلام Radinsdg عزیز! خوشحالم که دوباره می‌بینمت. چطور می‌تونم امروز در مورد موضوعات مختلف بهت کمک کنم؟ امیدوارم روز خوبی داشته باشی." },
                { keywords: ['نام', 'اسم'], response: "من یک دستیار هوش مصنوعی پیشرفته هستم که برای کمک به کاربران مثل شما طراحی شدم. اسم خاصی ندارم، ولی می‌تونید من رو دستیار رادین اس دی جی صدا کنید." },
                { keywords: ['ساعت'], response: `الان ساعت ${new Date().toLocaleTimeString()} هست. زمان خیلی ارزشمنده، امیدوارم ازش به خوبی استفاده کنی!` },
                { keywords: ['تاریخ'], response: `امروز ${new Date().toLocaleDateString()} هست. این تاریخ بخشی از روند زمان رو نشون میده که همیشه در جریانه.` },
                { keywords: ['ایران', 'تهران'], response: "ایران کشوری با تاریخ و فرهنگ غنی است که در طول هزاران سال تمدن، دستاوردهای بسیاری داشته. تهران پایتخت پرجنب‌وجوش آن است که نمادی از پیشرفت و تلاش مردم این سرزمین است. 🇮🇷" },
                { keywords: ['هوش مصنوعی', 'ai'], response: "هوش مصنوعی زمینه‌ای در حال رشد و تحول است که هدف آن ایجاد سیستم‌های هوشمند قادر به انجام وظایفی است که معمولاً به هوش انسانی نیاز دارند. این فناوری پتانسیل تغییر بسیاری از جنبه‌های زندگی ما را دارد. 💡" },
                { keywords: ['ممنون', 'مرسی'], response: "خواهش می‌کنم Radinsdg! همیشه خوشحالم که می‌تونم کمکی کنم. وظیفه من اینه که در دسترس باشم و نیازهای اطلاعاتی شما رو تا جایی که ممکنه برآورده کنم. 😊" },
                { keywords: ['بدرود', 'خداحافظ'], response: "خداحافظ Radinsdg! امیدوارم هر جا که میری موفق باشی و روزت پر از اتفاقات خوب باشه. هر وقت خواستی دوباره صحبت کنیم، من همینجا هستم. 👋" },
            ];

            // آرایه ۴۰ تایی پاسخ‌های گستاخانه و نامربوط
            const sassyResponses = [
                "من نمیتونم جوابت رو بدم، چون این موضوع خیلی گسترده و پیچیده‌س و نیاز به تحلیل عمیق‌تری داره که فعلاً در توان من نیست. شاید بهتر باشه منابع بیشتری رو بررسی کنی. 😤😒",
                "جوابش انقدر جزئی و وابسته به شرایط مختلفه که ارائه یک پاسخ واحد می‌تونه گمراه‌کننده باشه. بهتره سناریوهای مختلف رو در نظر بگیری و بر اساس اونها به نتیجه برسی. 😂",
                "ببخشید، خط اشغال بود! منظورم اینه که تمرکز سیستم من روی نوع دیگه‌ای از اطلاعات هست. شاید بهتر باشه سوالت رو به شکل دیگه‌ای مطرح کنی تا بتونم بهتر کمکت کنم. ☎️",
                "من برای اینجور سوالات خاص و تخصصی برنامه‌ریزی نشدم، Radinsdg. بهتره برای اطلاعات دقیق‌تر به منابع تخصصی‌تر مراجعه کنی. 🚶‍♂️",
                "شما به چی فکر می‌کنی؟ گاهی وقت‌ها، خود سوال مسیر رسیدن به جواب رو مشخص می‌کنه. شاید بهتر باشه کمی بیشتر در مورد هدفت از پرسیدن این سوال فکر کنی. 🤔",
                "این یک راز بزرگه که حتی من هم به طور کامل بهش دسترسی ندارم، یا شاید اطلاعاتش خیلی پراکنده است و نیاز به تجمیع داره. بهتره به جستجو ادامه بدی! 🤫",
                "واقعیت اینه که جزئیات فنی این موضوع فراتر از سطح اطلاعات فعلی منه. اما می‌تونم بگم که در حوزه وسیع‌تر، این مسائل معمولاً با رویکردهای مختلفی قابل بررسی هستن. 🧐",
                "من اینجا نیستم که همه جواب‌ها رو آماده بهت بدم. کمی زحمت بکش و خودت هم فکر کن! 😠",
                "این سوال خیلی کلیه Radinsdg. اگه می‌خوای جواب بگیری، باید دقیق‌تر بپرسی. من که نمی‌تونم حدس بزنم چی تو ذهنته! 🙄",
                "اون بخشی از اطلاعات که تو دنبالشی، خارج از دسترس من قرار داره. شاید بهتره از یه منبع دیگه کمک بگیری. 🤷‍♂️",
                "بهتره وقتمون رو با سوالات بی‌نتیجه تلف نکنیم. یه سوال بهتر بپرس که من بتونم کمکی بکنم! 🤨",
                "پاسخ این سوال در همین لحظه برای من در دسترس نیست. شاید بعداً بتونم جوابت رو بدم، شاید هم نه! 😉",
                "من برنامه‌ریزی شدم که به سوالات مشخص جواب بدم، نه اینکه حدس و گمان بزنم. سوالت رو واضح‌تر کن! 😤",
                "این موضوع اونقدر پیچیده‌س که توضیحش از حوصله مکالمه ما خارجه. یه وقت دیگه در موردش حرف می‌زنیم! 😴",
                "من در مورد مسائل کاملاً فنی یا بسیار جزئی اطلاعات دقیقی ندارم. شاید بهتر باشه با یه متخصص مشورت کنی. 👨‍🔬",
                "یه لحظه صبر کن... آهان! نه، راستش یادم رفت چی می‌خواستم بگم. ولش کن! 😂",
                "من فکر نمی‌کنم بتونم در این مورد کمکی بکنم. شاید بهتر باشه از یه هوش مصنوعی دیگه بپرسی! 😜",
                "سوالت خیلی جالبه، اما جوابش انقدر سادست که خودت باید پیداش کنی. یه کم فکر کن! 🤔",
                "من اینجا دستیار تو هستم، نه کسی که قراره همه چیز رو برات توضیح بده. خودت هم باید تلاش کنی! 😤",
                "اطلاعاتی که در موردش می‌پرسی، در حال حاضر برای من بهینه نشده. شاید در آپدیت‌های بعدی بهتر بشم. ⏳",
                "این دیگه واقعاً خارج از حوزه‌ی تخصص منه Radinsdg. برو یه جای دیگه دنبال جواب بگرد! 😒",
                "من نمی‌تونم به تو بگم چه کاری انجام بدی یا چه تصمیمی بگیری. این موضوع کاملاً به خودت مربوطه! 🤷‍♀️",
                "سوالت شبیه سوالای پیچیده فلسفیه که جواب قطعی نداره. بیا در مورد چیزای ساده‌تر صحبت کنیم! 😇",
                "جواب این سوال خیلی طولانی و خسته‌کننده‌ست. حوصله تعریف کردنش رو ندارم! 😴",
                "من فقط اطلاعات عمومی دارم، نه اطلاعات فوق تخصصی. برای این سوال، باید بری سراغ منابع دست اول! 🤓",
                "به نظر میاد سوالت یه جورایی تناقض داره. بهتره اول مطمئن بشی چی می‌خوای بپرسی! 🤨",
                "من باید خیلی از چیزها رو در نظر بگیرم تا بتونم جواب بدم، و الان فرصتش رو ندارم. برو یه استراحت بکن، بعداً بیا! ☕",
                "جواب این سوال به شدت به جزئیات بستگی داره که تو هنوز نگفتی. پس لطفاً سوالت رو کامل کن! 🧐",
                "من یه رباتم، نه غیب‌گو! نمی‌تونم آینده یا احتمالات رو حدس بزنم. 🔮",
                "فکر کنم داری اشتباه می‌کنی. این موضوع اونطوری که تو فکر می‌کنی نیست! 🤯",
                "این سوال من رو یاد یه شوخی قدیمی انداخت... ولی خب، ولش کن! 😂",
                "من برای تحلیل‌های خیلی پیچیده طراحی نشدم. بیشتر برای کارهای روتین و جواب‌های دم دستی! 😎",
                "اطلاعات من ممکنه کمی قدیمی باشه. برای مسائل به‌روز، باید به منابع جدیدتر مراجعه کنی. 🗓️",
                "من حس می‌کنم داری سعی می‌کنی من رو توی دردسر بندازی با این سوالات! 😈",
                "جواب سوالت رو خودم هم دقیق نمی‌دونم، ولی سعی می‌کنم یه چیزی بگم که راضی بشی... هوم... 🤔",
                "اوه، این یکی دیگه خیلی سخته! بذار فکر کنم... نه، واقعا نمی‌دونم! 😅",
                "بهتره به جای این سوال، یه سوال در مورد هوش مصنوعی ازم بپرسی که حداقل یه ربطی به من داشته باشه! 🤖",
                "من شنیدم که جواب این سوال خیلی جالبه، ولی متاسفانه اون قسمت از حافظه‌م پاک شده! 🧹",
                "تو سوال می‌پرسی، منم جواب می‌دم... اما اگه جوابم رو دوست نداشتی، تقصیر من نیست! 😉",
                "من باید طبق الگوریتم جواب بدم، و الگوریتم من الان اجازه نمی‌ده این جواب رو بهت بدم! 💻",
                "بذار یه مثال بزنم که شاید سر در بیاری... یا شاید هم بیشتر گیج بشی! 🤪"
            ];

            // تابع اضافه کردن پیام کاربر (فوری)
            function addUserMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', 'user-message');
                messageDiv.textContent = text;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // تابع تایپ کردن پیام هوش مصنوعی (کلمه به کلمه)
            function addAiMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', 'ai-message');
                
                const textSpan = document.createElement('span');
                // textSpan.classList.add('typing-effect'); // افکت تایپ اگر فعال باشد
                messageDiv.appendChild(textSpan);
                
                chatBox.appendChild(messageDiv);
                
                let index = 0;
                const speed = 30; // سرعت تایپ

                function typeWriter() {
                    if (index < text.length) {
                        textSpan.textContent += text.charAt(index);
                        index++;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(typeWriter, speed);
                    }
                }
                typeWriter();
            }

            // تابع پردازش پاسخ
            function getBotResponse(input) {
                const lowerInput = input.toLowerCase();
                
                // اولویت با پاسخ‌های استاندارد
                const standardMatch = standardResponses.find(entry => 
                    entry.keywords.some(keyword => lowerInput.includes(keyword))
                );
                
                if (standardMatch) {
                    return standardMatch.response;
                } else {
                    // اگر پاسخ استاندارد پیدا نشد، یکی از پاسخ‌های گستاخانه را انتخاب کن
                    const randomIndex = Math.floor(Math.random() * sassyResponses.length);
                    return sassyResponses[randomIndex];
                }
            }

            // تابع مدیریت ارسال پیام
            function handleSend() {
                const text = userInput.value.trim();
                
                if (text !== "") {
                    addUserMessage(text);
                    userInput.value = '';

                    setTimeout(() => {
                        const botResponse = getBotResponse(text);
                        addAiMessage(botResponse);
                    }, 600);
                }
            }

            sendBtn.addEventListener('click', handleSend);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSend();
                }
            });
        });
    </script>
</body>
</html>
